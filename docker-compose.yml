services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osint}
      POSTGRES_DB: ${POSTGRES_DB:-osint}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osint} -d ${POSTGRES_DB:-osint}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./server
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@db:5432/${POSTGRES_DB:-osint}
      PORT: "8787"
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
      AI_GATEWAY_KEY: ${AI_GATEWAY_KEY:-}
      OPENROUTER_LIGHT_MODEL: ${OPENROUTER_LIGHT_MODEL:-}
      OPENROUTER_MID_MODEL: ${OPENROUTER_MID_MODEL:-}
      TIMELINE_MAX_EVENTS: ${TIMELINE_MAX_EVENTS:-40}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  workers:
    build: ./server
    command: ["npm", "run", "workers:start"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-osint}:${POSTGRES_PASSWORD:-osint}@db:5432/${POSTGRES_DB:-osint}
      RSS_FEEDS: ${RSS_FEEDS:-}
      RSS_POLL_SECONDS: ${RSS_POLL_SECONDS:-120}
      RSS_MAX_BACKOFF: ${RSS_MAX_BACKOFF:-10}
      TG_PREVIEW_CHANNELS: ${TG_PREVIEW_CHANNELS:-}
      TG_PREVIEW_POLL_SECONDS: ${TG_PREVIEW_POLL_SECONDS:-120}
      TG_PREVIEW_MAX_PAGES: ${TG_PREVIEW_MAX_PAGES:-25}
      TG_PREVIEW_DELAY_SECONDS: ${TG_PREVIEW_DELAY_SECONDS:-2}
      TG_PREVIEW_MAX_REDIRECTS: ${TG_PREVIEW_MAX_REDIRECTS:-5}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_SESSION: ${TG_SESSION:-}
      TG_CHANNELS: ${TG_CHANNELS:-}
      TG_MAX_CHANNELS: ${TG_MAX_CHANNELS:-40}
      TG_RESOLVE_DELAY_SECONDS: ${TG_RESOLVE_DELAY_SECONDS:-5}
      TG_HEARTBEAT_SECONDS: ${TG_HEARTBEAT_SECONDS:-120}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
      AI_GATEWAY_KEY: ${AI_GATEWAY_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: .
    # Coolify's reverse proxy reaches this container directly on port 80.
    # A fixed host bind caused "port is already allocated" on deploy.
    expose:
      - "80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
