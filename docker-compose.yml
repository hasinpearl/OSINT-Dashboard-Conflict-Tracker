services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: osint
      POSTGRES_USER: osint
      POSTGRES_PASSWORD: osint_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint"]
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: 
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://osint:osint_pass@db:5432/osint
      PORT: 8787
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8787:8787"
      
  workers:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://osint:osint_pass@db:5432/osint
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "workers:start"]

volumes:
  postgres_data: